name: master_help
description: Master Help - Auto Service Marketplace Mobile App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase Integration
  supabase_flutter: ^2.5.0

  # Geolocation & Maps
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # State Management & Network
  flutter_bloc: ^8.1.3
  rxdart: ^0.27.7

  # UI & Icons
  cupertino_icons: ^1.0.6
  lucide_icons: ^0.257.0

  # Image Picker (profile photo)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
