name: Build Mobile Apps (Android APK + iOS IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  #  Android APK Build
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: |
          cd mobile
          flutter create --platforms android . --project-name master_help

      - name: Get Flutter dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android APK
        run: |
          cd mobile
          flutter build apk --release --no-pub
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avtohelp-Android-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  #  iOS IPA Build
  # ─────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate iOS platform files
        run: |
          cd mobile
          flutter create --platforms ios . --project-name master_help

      - name: Get Flutter dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Set iOS deployment target to 14.0
        run: |
          cd mobile/ios
          # Update platform version in Podfile (google_maps_flutter requires >= 14.0)
          sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '14.0'/" Podfile
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '14.0'/" Podfile
          echo "--- Podfile platform line ---"
          grep "platform" Podfile || echo "(no platform line found, adding)"
          # If no platform line exists at all, prepend it
          grep -q "^platform" Podfile || sed -i '' "1s/^/platform :ios, '14.0'\n/" Podfile

      - name: Install CocoaPods dependencies
        run: |
          cd mobile/ios
          pod install --repo-update

      - name: Build iOS (no code sign)
        run: |
          cd mobile
          flutter build ipa --release --no-codesign --no-pub
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avtohelp-iOS-Release-IPA
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: warn
