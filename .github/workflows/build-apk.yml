name: Build Mobile Apps (Android APK + iOS IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  #  Android APK Build
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform files
        run: |
          cd mobile
          flutter create --platforms android . --project-name master_help

      - name: Get Flutter dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android APK
        run: |
          cd mobile
          flutter build apk --release --no-pub
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avtohelp-Android-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  #  iOS IPA Build
  # ─────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS platform files
        run: |
          cd mobile
          flutter create --platforms ios . --project-name master_help

      - name: Get Flutter dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Set iOS deployment target to 14.0
        run: |
          cd mobile/ios
          sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '14.0'/" Podfile
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '14.0'/" Podfile
          grep -q "^platform" Podfile || sed -i '' "1s/^/platform :ios, '14.0'\n/" Podfile
          echo "--- Podfile ---"
          cat Podfile | grep platform

      - name: Install CocoaPods dependencies
        run: |
          cd mobile/ios
          pod install --repo-update

      - name: Build iOS archive (no code sign)
        run: |
          cd mobile
          flutter build ipa --release --no-codesign --no-pub
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Package IPA from xcarchive
        run: |
          cd mobile
          # Find the .app inside xcarchive
          ARCHIVE=$(find build/ios/archive -name "*.xcarchive" | head -1)
          echo "Archive found: $ARCHIVE"
          APP_PATH=$(find "$ARCHIVE/Products/Applications" -name "*.app" 2>/dev/null | head -1)
          echo "App found: $APP_PATH"

          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r master_help.ipa Payload
          rm -rf Payload
          echo "IPA created at: $(pwd)/master_help.ipa"
          ls -lh *.ipa

      - name: Build iOS Simulator App
        run: |
          cd mobile
          flutter build ios --simulator --no-codesign --no-pub
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Package Simulator App ZIP
        run: |
          cd mobile/build/ios/iphonesimulator
          APP_NAME=$(ls -d *.app | head -1)
          zip -r ../../../master_help_simulator.zip "$APP_NAME"
          echo "Simulator ZIP created"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avtohelp-iOS-Release-IPA
          path: mobile/build/ios/ipa/master_help.ipa
          if-no-files-found: warn

      - name: Upload Simulator APP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avtohelp-iOS-Simulator-APP
          path: mobile/master_help_simulator.zip
          if-no-files-found: warn


