name: Build Mobile Apps (Android APK + iOS IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────
  #  Android APK Build
  # ────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform files
        run: |
          cd mobile
          flutter create --platforms android . --project-name master_help

      - name: Get Flutter dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android APK
        run: |
          cd mobile
          flutter build apk --release --no-pub
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avtohelp-Android-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────
  #  iOS Signed Ad Hoc IPA Build
  # ────────────────────────────────────────────────────────────────────────
  build-ios:
    name: Build Signed iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Set iOS deployment target to 14.0
        run: |
          cd mobile/ios
          sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '14.0'/" Podfile
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '14.0'/" Podfile
          grep -q "^platform" Podfile || sed -i '' "1s/^/platform :ios, '14.0'\n/" Podfile
          echo "--- Podfile ---"
          cat Podfile | grep platform

      - name: Install CocoaPods dependencies
        run: |
          cd mobile/ios
          pod install --repo-update

      - name: Install Apple Certificate and Provisioning Profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          # 1. Fail early if required signing secrets are missing
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "Error: One or more signing secrets (P12_BASE64, P12_PASSWORD, PROVISIONING_PROFILE_BASE64) are missing."
            exit 1
          fi

          # 2. Setup variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 3. Import certificate and provisioning profile from secrets
          echo -n "$P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # 4. Create temporary keychain
          security create-keychain -p "$P12_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$P12_PASSWORD" $KEYCHAIN_PATH

          # 5. Import certificate to keychain
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" $KEYCHAIN_PATH

          # 6. Extract UUID from profile and copy to Provisioning Profiles directory
          UUID=$(security cms -D -i $PP_PATH | grep -A1 UUID | grep string | sed -E 's/<\/?string>//g' | tr -d '[:space:]')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "Provisioning Profile installed with UUID: $UUID"

      - name: Build iOS IPA (Ad Hoc Distribution)
        run: |
          cd mobile
          flutter build ipa --release --export-method=ad-hoc --no-pub
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Verify IPA Signature
        run: |
          cd mobile/build/ios/ipa
          # Find the generated .ipa file
          IPA_FILE=$(find . -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "Error: No IPA file was generated by Flutter."
            exit 1
          fi
          echo "Found IPA: $IPA_FILE"
          
          # Unzip it to inspect the app bundle
          unzip -q "$IPA_FILE" -d ipa_temp
          APP_PATH=$(find ipa_temp/Payload -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App bundle not found inside Payload."
            exit 1
          fi
          echo "Inspecting app bundle at: $APP_PATH"
          
          # Run verification and print signing certificate details
          codesign -vd "$APP_PATH"
          
          # Verify entitlements/validity
          codesign --verify --verbose "$APP_PATH"
          
          # Clean up temp folder
          rm -rf ipa_temp

      - name: Clean up temporary keychain and profiles
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/build_certificate.p12
          rm -f $RUNNER_TEMP/build_pp.mobileprovision

      - name: Upload Signed Ad Hoc IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avtohelp-iOS-Signed-AdHoc-IPA
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: warn
